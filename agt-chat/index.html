<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agente IA RAG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="chat-container">

    <header>

        <h2>🤖 Agente IA Veterinario</h2>
        <p>Consulta información acerca de las enfermedades en gatos domésticos</p>

    </header>

    <div id="chat"></div>

    <div class="input-area">

        <input
            id="question"
            type="text"
            placeholder="Escribe una pregunta..."
            autocomplete="off">

        <button id="send">
            ➤
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
